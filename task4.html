
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Font Family Example</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            font-family: Georgia, serif;
            color: blue;
            text-align: center;
        }

        .p1 {
            font-family: Arial, sans-serif;
            font-size: 20px;
        }

        .p2 {
            font-family: "Times New Roman", serif;
            font-size: 20px;
        }

        .p3 {
            font-family: "Courier New", monospace;
            font-size: 20px;
        }

        .p4 {
            font-family: Verdana, sans-serif;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>CSS Font Family</h1>

    <p class="p1">This text uses Arial font.</p>

    <p class="p2">This text uses Times New Roman font.</p>

    <p class="p3">This text uses Courier New font.</p>

    <p class="p4">This text uses Verdana font.</p>
</body>
</html>
